name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEYSTORE" || { echo 'Missing signing keystore secret'; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/perch-release.jks"
          chmod 600 "$RUNNER_TEMP/perch-release.jks"
      - name: Test, lint and build signed release
        env:
          PERCH_KEYSTORE_PATH: ${{ runner.temp }}/perch-release.jks
          PERCH_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          PERCH_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          PERCH_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Prepare APK and checksum
        id: package
        run: python3 tools/prepare_release.py
      - name: Verify APK signature
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/Perch-$VERSION.apk"'
      - uses: actions/upload-artifact@v4
        with:
          name: Perch-${{ steps.package.outputs.version }}
          path: dist/*
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "栖信 $VERSION" --notes-file "release-notes/$VERSION.md"
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/perch-release.jks"
